<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8eaf0" />
      <stop offset="100%" stop-color="#d4d8e0" />
    </radialGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f2a60" />
    </linearGradient>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fundo branco circular externo -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)" />
  <circle cx="256" cy="256" r="232" fill="#ffffff" />
  <circle cx="256" cy="256" r="230" stroke="#b8c2d0" stroke-width="4" />
  
  <!-- Quadrado azul arredondado -->
  <rect x="104" y="104" width="304" height="304" rx="72" ry="72" fill="url(#cardBg)" />
  <rect x="114" y="114" width="284" height="284" rx="62" ry="62" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="5" />
  
  <!-- Calendário branco -->
  <g fill="#ffffff">
    <rect x="180" y="156" width="32" height="32" rx="8" ry="8" />
    <rect x="300" y="156" width="32" height="32" rx="8" ry="8" />
    <rect x="168" y="196" width="176" height="204" rx="18" ry="18" />
    <rect x="212" y="236" width="28" height="28" rx="5" ry="5" />
    <rect x="270" y="236" width="28" height="28" rx="5" ry="5" />
    <rect x="328" y="236" width="28" height="28" rx="5" ry="5" />
    <rect x="212" y="292" width="28" height="28" rx="5" ry="5" />
    <rect x="270" y="292" width="28" height="28" rx="5" ry="5" />
    <rect x="328" y="292" width="28" height="28" rx="5" ry="5" />
    <rect x="212" y="348" width="28" height="28" rx="5" ry="5" />
    <rect x="270" y="348" width="28" height="28" rx="5" ry="5" />
    <rect x="328" y="348" width="28" height="28" rx="5" ry="5" />
  </g>
  
  <!-- Checkmark branco -->
  <path fill="#ffffff" d="M224 344 l 40 54 l 82 -96" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Estrelinha branca -->
  <g filter="url(#starGlow)" fill="#ffffff">
    <circle cx="344" cy="356" r="13" />
    <path d="M340 350 l 3 12 l 12 3 l -9 8 l 3 12 l -12 -3 l -9 -8 z" />
  </g>
  
  <!-- Texto AGENDA -->
  <text x="256" y="404" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">AGENDA</text>
  
  <!-- Texto PRO azul claro -->
  <text x="256" y="464" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="900" fill="#60a5fa" text-anchor="middle" letter-spacing="1">PRO</text>
  
  <!-- Estrelinha ao lado do PRO -->
  <circle cx="348" cy="452" r="11" fill="#60a5fa" filter="url(#starGlow)" />
  <path fill="#ffffff" d="M344 448 l 3 12 l 12 3 l -9 8 l 3 12 l -12 -3 l -9 -8 z" />
</svg>